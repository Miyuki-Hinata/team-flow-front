# TeamFlow フロント（SPA）配信用の nginx 設定。
# nginx 公式イメージの既定サイト設定（/etc/nginx/conf.d/default.conf）を
# Dockerfile でこのファイルに差し替えて使う。

server {
    # コンテナ内の 80 番で待ち受ける（EXPOSE 80 と対応）
    listen 80;

    # 配信元フォルダと入口ファイル（公式イメージの既定と同じ場所）
    root /usr/share/nginx/html;
    index index.html;

    location / {
        # SPA の history fallback。
        # まず要求されたパス（$uri）に一致するファイルを探し、
        # 無ければ 404 ではなく index.html を返す。
        # index.html が返れば React が起動し、URL の解釈は
        # React Router（App.tsx の Route 対応表）がブラウザ側で行う。
        # これが無いと /my-patients 等への直リンク・リロードが 404 になる
        try_files $uri /index.html;
    }
}
